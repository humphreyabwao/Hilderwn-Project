<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in — Hildernw Admin</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" type="image/jpeg" href="../../assets/images/logo.jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/login.css" />
    <script>
      (function () {
        var modes = ['light', 'dark', 'system'];
        var mode = 'system';
        try {
          var s = localStorage.getItem('admin-theme-mode');
          if (modes.indexOf(s) !== -1) mode = s;
        } catch (e) {}
        var resolved = mode === 'system'
          ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : mode;
        document.documentElement.setAttribute('data-theme', resolved);
      })();
    </script>
    <link rel="preload" as="image" href="../../assets/images/DSC_0908.jpg.jpeg" />
  </head>
  <body>

    <div class="login-page">
      <div class="login-page__bg" aria-hidden="true"></div>
      <div class="login-page__overlay" aria-hidden="true"></div>

      <div class="login-card">
        <a href="/" class="login-card__brand">
          <img src="../../assets/images/logo.jpeg" alt="" width="44" height="44" />
          <div>
            <strong>Hildernw Mining</strong>
            <span>Admin</span>
          </div>
        </a>

        <h1 class="login-card__title">Sign in</h1>

        <form class="login-form" id="login-form" novalidate>
          <p class="login-error" id="login-error" role="alert"></p>

          <label class="login-field">
            <span>Email</span>
            <input type="email" name="email" id="login-email" autocomplete="username" required />
          </label>

          <label class="login-field">
            <span>Password</span>
            <input type="password" name="password" id="login-password" autocomplete="current-password" required />
          </label>

          <button type="submit" class="login-submit" id="login-submit">Sign in</button>
        </form>

        <div class="login-footer">
          <a href="/">View website</a>
        </div>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="../../js/firebase.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../js/login.js"></script>
  </body>
</html>
